<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <rect width="860" height="480" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="38" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Bracket Stack — Two Families</text>

  <!-- Shared invariant banner -->
  <rect x="20" y="54" width="820" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="430" y="76" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">Shared invariant: stack top = innermost open context not yet resolved</text>

  <!-- Family 1 box -->
  <rect x="20" y="106" width="390" height="334" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="106" width="390" height="34" rx="8" fill="#1d3461"/>
  <text x="215" y="128" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Family 1 — Matching</text>

  <text x="40" y="162" fill="#94a3b8" font-family="monospace" font-size="12">Problems: #20 Valid Parens, #1249 Min Remove</text>

  <text x="40" y="192" fill="#e2e8f0" font-family="monospace" font-size="12">Stack stores:  open bracket chars  (  [  {</text>
  <text x="40" y="214" fill="#e2e8f0" font-family="monospace" font-size="12">On open:       push char onto stack</text>
  <text x="40" y="236" fill="#e2e8f0" font-family="monospace" font-size="12">On close:      check top matches type</text>
  <text x="40" y="258" fill="#e2e8f0" font-family="monospace" font-size="12">Post-loop:     stack must be empty</text>

  <!-- 3 guards -->
  <rect x="40" y="272" width="350" height="92" rx="6" fill="#1e293b"/>
  <text x="56" y="292" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">Three Guards (all required):</text>
  <text x="56" y="312" fill="#86efac" font-family="monospace" font-size="11">Guard 1: not stack          → unmatched close</text>
  <text x="56" y="330" fill="#86efac" font-family="monospace" font-size="11">Guard 2: stack[-1] != match[c] → type mismatch</text>
  <text x="56" y="348" fill="#86efac" font-family="monospace" font-size="11">Guard 3: return not stack   → unmatched opens</text>

  <text x="40" y="392" fill="#f87171" font-family="monospace" font-size="11">Miss G1 → IndexError</text>
  <text x="40" y="410" fill="#f87171" font-family="monospace" font-size="11">Miss G2 → accepts ([)]  as valid</text>
  <text x="40" y="428" fill="#f87171" font-family="monospace" font-size="11">Miss G3 → accepts (((  as valid</text>

  <!-- Family 2 box -->
  <rect x="450" y="106" width="390" height="334" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="450" y="106" width="390" height="34" rx="8" fill="#064e3b"/>
  <text x="645" y="128" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Family 2 — Scoring</text>

  <text x="470" y="162" fill="#94a3b8" font-family="monospace" font-size="12">Problem: #856 Score of Parentheses</text>

  <text x="470" y="192" fill="#e2e8f0" font-family="monospace" font-size="12">Stack stores:  running sums per depth</text>
  <text x="470" y="214" fill="#e2e8f0" font-family="monospace" font-size="12">On  ( :        push 0  (fresh layer)</text>
  <text x="470" y="236" fill="#e2e8f0" font-family="monospace" font-size="12">On  ) :        pop inner; stack[-1] +=</text>
  <text x="470" y="252" fill="#e2e8f0" font-family="monospace" font-size="12">               max(2 * inner, 1)</text>
  <text x="470" y="274" fill="#e2e8f0" font-family="monospace" font-size="12">Answer:        stack[0]</text>

  <!-- O(1) shortcut -->
  <rect x="470" y="288" width="350" height="92" rx="6" fill="#1e293b"/>
  <text x="486" y="308" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">O(1) Space Shortcut:</text>
  <text x="486" y="328" fill="#86efac" font-family="monospace" font-size="11">leaf () at depth d → contributes 2^(d-1)</text>
  <text x="486" y="346" fill="#86efac" font-family="monospace" font-size="11">after ) decrement: depth = original - 1</text>
  <text x="486" y="364" fill="#86efac" font-family="monospace" font-size="11">score += 1 &lt;&lt; depth  ←  2^(original-1) ✓</text>

  <text x="470" y="404" fill="#67e8f9" font-family="monospace" font-size="11">Example: (()(()))  →  leaves at d=2,3</text>
  <text x="470" y="422" fill="#67e8f9" font-family="monospace" font-size="11">  1&lt;&lt;1 = 2  +  1&lt;&lt;2 = 4  =  6 ✓</text>
</svg>
