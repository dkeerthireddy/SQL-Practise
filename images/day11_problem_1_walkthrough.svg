<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <rect width="860" height="520" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="36" fill="#f1f5f9" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">Valid Parentheses — Stack Walkthrough: "([{}])"</text>

  <!-- Column headers -->
  <text x="60"  y="62" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Step</text>
  <text x="140" y="62" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Char</text>
  <text x="260" y="62" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Action</text>
  <text x="480" y="62" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Guard check</text>
  <text x="700" y="62" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Stack after</text>
  <line x1="20" y1="70" x2="840" y2="70" stroke="#334155" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="20" y="76" width="820" height="46" rx="4" fill="#1e293b"/>
  <text x="60"  y="104" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">1</text>
  <text x="140" y="104" fill="#60a5fa" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">(</text>
  <text x="260" y="104" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">open → push</text>
  <text x="480" y="104" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">—</text>
  <text x="700" y="104" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ '(' ]</text>

  <!-- Row 2 -->
  <rect x="20" y="128" width="820" height="46" rx="4" fill="#0f172a"/>
  <text x="60"  y="156" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">2</text>
  <text x="140" y="156" fill="#60a5fa" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">[</text>
  <text x="260" y="156" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">open → push</text>
  <text x="480" y="156" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">—</text>
  <text x="700" y="156" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ '(', '[' ]</text>

  <!-- Row 3 -->
  <rect x="20" y="180" width="820" height="46" rx="4" fill="#1e293b"/>
  <text x="60"  y="208" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">3</text>
  <text x="140" y="208" fill="#60a5fa" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">{</text>
  <text x="260" y="208" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">open → push</text>
  <text x="480" y="208" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">—</text>
  <text x="700" y="208" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ '(', '[', '{' ]</text>

  <!-- Row 4 -->
  <rect x="20" y="232" width="820" height="46" rx="4" fill="#0f172a"/>
  <text x="60"  y="260" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">4</text>
  <text x="140" y="260" fill="#f87171" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">}</text>
  <text x="260" y="260" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">close → check top</text>
  <text x="480" y="252" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G1: stack non-empty ✓</text>
  <text x="480" y="268" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G2: top='{' == '{' ✓ → pop</text>
  <text x="700" y="260" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ '(', '[' ]</text>

  <!-- Row 5 -->
  <rect x="20" y="284" width="820" height="46" rx="4" fill="#1e293b"/>
  <text x="60"  y="312" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">5</text>
  <text x="140" y="312" fill="#f87171" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">]</text>
  <text x="260" y="312" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">close → check top</text>
  <text x="480" y="304" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G1: stack non-empty ✓</text>
  <text x="480" y="320" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G2: top='[' == '[' ✓ → pop</text>
  <text x="700" y="312" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ '(' ]</text>

  <!-- Row 6 -->
  <rect x="20" y="336" width="820" height="46" rx="4" fill="#0f172a"/>
  <text x="60"  y="364" fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle">6</text>
  <text x="140" y="364" fill="#f87171" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">)</text>
  <text x="260" y="364" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">close → check top</text>
  <text x="480" y="356" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G1: stack non-empty ✓</text>
  <text x="480" y="372" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">G2: top='(' == '(' ✓ → pop</text>
  <text x="700" y="364" fill="#86efac" font-family="monospace" font-size="13" text-anchor="middle">[ ]</text>

  <!-- Post-loop -->
  <rect x="20" y="396" width="820" height="44" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="430" y="413" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Post-loop  Guard 3:  stack = []  →  not stack = True  →  return True ✓</text>
  <text x="430" y="430" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">All opens matched; no unmatched opens remain</text>

  <!-- Edge case strip -->
  <rect x="20" y="454" width="820" height="50" rx="4" fill="#1e293b"/>
  <text x="40" y="472" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">Edge cases:</text>
  <text x="40" y="492" fill="#f87171" font-family="monospace" font-size="11">"]" → G1 fires (empty stack) → False    |    "([)]" → G2 fires (mismatch) → False    |    "(((" → G3 fires (non-empty) → False</text>
</svg>
