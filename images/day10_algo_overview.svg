<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480">
  <rect width="840" height="480" fill="#0f172a"/>

  <!-- Title -->
  <text x="420" y="36" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Stack Simulation — Algorithm Overview</text>
  <text x="420" y="58" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">Day 10: Stack Simulation / Undo Operation</text>

  <!-- Step boxes -->
  <!-- Step 1: Initialize -->
  <rect x="320" y="80" width="200" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="420" y="101" font-family="monospace" font-size="13" fill="#93c5fd" text-anchor="middle">1. We initialize</text>
  <text x="420" y="120" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">stack = []</text>

  <!-- Arrow down -->
  <line x1="420" y1="132" x2="420" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Scan loop -->
  <rect x="260" y="155" width="320" height="52" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="176" font-family="monospace" font-size="13" fill="#c4b5fd" text-anchor="middle">2. We scan each element left → right</text>
  <text x="420" y="195" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">for element in input:</text>

  <!-- Arrow down to diamond -->
  <line x1="420" y1="207" x2="420" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: undo signal? -->
  <polygon points="420,235 520,270 420,305 320,270" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="265" font-family="monospace" font-size="12" fill="#fcd34d" text-anchor="middle">undo</text>
  <text x="420" y="282" font-family="monospace" font-size="12" fill="#fcd34d" text-anchor="middle">signal?</text>

  <!-- NO branch — left → push -->
  <line x1="320" y1="270" x2="170" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="260" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">NO</text>
  <rect x="70" y="245" width="200" height="52" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="170" y="266" font-family="monospace" font-size="13" fill="#86efac" text-anchor="middle">3. We push element</text>
  <text x="170" y="285" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">stack.append(elem)</text>

  <!-- YES branch — right → check empty -->
  <line x1="520" y1="270" x2="620" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="260" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">YES</text>

  <!-- Diamond: stack empty? -->
  <polygon points="680,250 760,270 680,290 600,270" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="266" font-family="monospace" font-size="11" fill="#fcd34d" text-anchor="middle">stack</text>
  <text x="680" y="280" font-family="monospace" font-size="11" fill="#fcd34d" text-anchor="middle">empty?</text>

  <!-- YES → skip -->
  <line x1="680" y1="290" x2="680" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="325" font-family="monospace" font-size="11" fill="#94a3b8">YES</text>
  <rect x="590" y="350" width="180" height="42" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="680" y="366" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">4a. We skip</text>
  <text x="680" y="383" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">(no-op at base)</text>

  <!-- NO → pop -->
  <line x1="760" y1="270" x2="800" y2="270" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="270" x2="800" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="360" x2="780" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="265" font-family="monospace" font-size="11" fill="#94a3b8">NO</text>
  <rect x="580" y="340" width="200" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <!-- Actually let me redo this more carefully -->

  <!-- Loop back arrows from push and skip/pop back up -->
  <line x1="170" y1="245" x2="170" y2="155" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="170" y1="155" x2="260" y2="155" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Step 5: Final state -->
  <rect x="310" y="395" width="220" height="52" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="420" y="416" font-family="monospace" font-size="13" fill="#67e8f9" text-anchor="middle">5. We read the result</text>
  <text x="420" y="435" font-family="monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">return stack  ← answer</text>

  <!-- Arrow from loop to final -->
  <text x="420" y="385" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">all elements processed</text>
  <line x1="420" y1="390" x2="420" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="410" width="200" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="428" font-family="monospace" font-size="11" fill="#64748b">Amortized O(n):</text>
  <text x="40" y="444" font-family="monospace" font-size="11" fill="#94a3b8">each elem: push once,</text>
  <text x="40" y="460" font-family="monospace" font-size="11" fill="#94a3b8">pop at most once → 2n ops</text>

  <!-- Pop box (replacing the broken one above) -->
  <rect x="590" y="342" width="200" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="358" font-family="monospace" font-size="12" fill="#fca5a5" text-anchor="middle">4b. We pop element</text>
  <text x="690" y="374" font-family="monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">stack.pop()</text>

  <!-- Arrows for NO-pop path -->
  <line x1="760" y1="270" x2="800" y2="270" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="270" x2="800" y2="363" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="363" x2="790" y2="363" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="260" font-family="monospace" font-size="11" fill="#94a3b8">NO</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
