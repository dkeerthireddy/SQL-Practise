<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="Consolas, Menlo, monospace">
  <rect width="840" height="420" fill="#0f172a"/>
  <text x="420" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">Min Stack — push(5), push(3), push(7), getMin(), pop(), getMin()</text>

  <!-- column headers -->
  <text x="120" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">step</text>
  <text x="260" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">action</text>
  <text x="450" y="66" text-anchor="middle" fill="#38bdf8" font-size="12">stack</text>
  <text x="650" y="66" text-anchor="middle" fill="#facc15" font-size="12">min_stack</text>

  <rect x="30" y="76" width="780" height="1" fill="#334155"/>

  <!-- rows -->
  <g font-size="13" fill="#e2e8f0">
    <text x="120" y="100" text-anchor="middle">1</text>
    <text x="260" y="100" text-anchor="middle">push(5)</text>
    <text x="450" y="100" text-anchor="middle" fill="#38bdf8">[5]</text>
    <text x="650" y="100" text-anchor="middle" fill="#facc15">[5]</text>

    <text x="120" y="130" text-anchor="middle">2</text>
    <text x="260" y="130" text-anchor="middle">push(3)</text>
    <text x="450" y="130" text-anchor="middle" fill="#38bdf8">[5, 3]</text>
    <text x="650" y="130" text-anchor="middle" fill="#facc15">[5, 3]</text>

    <text x="120" y="160" text-anchor="middle">3</text>
    <text x="260" y="160" text-anchor="middle">push(7)</text>
    <text x="450" y="160" text-anchor="middle" fill="#38bdf8">[5, 3, 7]</text>
    <text x="650" y="160" text-anchor="middle" fill="#facc15">[5, 3, 3]</text>
  </g>

  <rect x="30" y="172" width="780" height="26" rx="4" fill="#3f2d0f" stroke="#facc15"/>
  <text x="420" y="190" text-anchor="middle" fill="#facc15" font-size="12">↑ top of stack = 7, but top of min_stack = 3 — invariant, not a bug</text>

  <g font-size="13" fill="#e2e8f0">
    <text x="120" y="222" text-anchor="middle">4</text>
    <text x="260" y="222" text-anchor="middle">getMin()</text>
    <text x="450" y="222" text-anchor="middle" fill="#38bdf8">[5, 3, 7]</text>
    <text x="650" y="222" text-anchor="middle" fill="#facc15">[5, 3, 3]</text>
    <text x="770" y="222" text-anchor="middle" fill="#4ade80">→ 3</text>

    <text x="120" y="252" text-anchor="middle">5</text>
    <text x="260" y="252" text-anchor="middle">pop()</text>
    <text x="450" y="252" text-anchor="middle" fill="#38bdf8">[5, 3]</text>
    <text x="650" y="252" text-anchor="middle" fill="#facc15">[5, 3]</text>

    <text x="120" y="282" text-anchor="middle">6</text>
    <text x="260" y="282" text-anchor="middle">getMin()</text>
    <text x="450" y="282" text-anchor="middle" fill="#38bdf8">[5, 3]</text>
    <text x="650" y="282" text-anchor="middle" fill="#facc15">[5, 3]</text>
    <text x="770" y="282" text-anchor="middle" fill="#4ade80">→ 3</text>
  </g>

  <rect x="30" y="310" width="780" height="1" fill="#334155"/>
  <text x="420" y="340" text-anchor="middle" fill="#94a3b8" font-size="12">Every pop() removes one entry from BOTH stacks — lockstep, never independent.</text>
  <text x="420" y="364" text-anchor="middle" fill="#94a3b8" font-size="12">getMin() never scans — it just reads min_stack[-1].  O(1) time, every call.</text>
  <text x="420" y="398" text-anchor="middle" fill="#64748b" font-size="11">n = 100,000 pushes → 100,000 extra ints stored, not O(n²) rescans</text>
</svg>
